# Pull requests are squash-merged, so the title becomes the commit Release Please reads. This check
# fails a title that isn't a Conventional Commit (feat:, fix:, docs:, chore: and so on), so a bad
# title is caught before merge rather than giving a wrong version.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
