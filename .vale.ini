# Vale checks the writing in every page: plain English, the same names everywhere.
# The Handbook style lives in .vale/styles/Handbook. Other repos get a copy with the docs kit.
StylesPath = .vale/styles
Vocab = Handbook
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Handbook
# Spelling would need a dictionary of every product and code name; Terms and the vocabulary cover names.
Vale.Spelling = NO
# Code, front matter and URLs aren't prose.
BlockIgnores = (?s)^---\n.*?\n---
TokenIgnores = (`[^`]+`), (\]\([^)]+\))
