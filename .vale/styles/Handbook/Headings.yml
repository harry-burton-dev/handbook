# Headings in sentence case, like the page titles.
extends: capitalization
message: "Write '%s' in sentence case."
level: warning
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  - ADR
  - ADRs
  - CI
  - DevLake
  - Changesets
  - DORA
  - GitHub
  - Grafana
  - Linear
  - MSI
  - OpenFeature
  - Release Please
  - Starlight
  - Vale
  - Claude
  - Harry
  - Remote Control
